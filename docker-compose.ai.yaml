# docker-compose.ai.yaml
################################
# Base docker-compose file for Foundry AI services
# -> Ollama
# -> Open-WebUI
################################


services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks:
      - ai
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=http://192.168.7.*,http://localhost:*,http://127.0.0.1:*,app://*,rtvtt://*
      - OLLAMA_NO_CLOUD=1
    ports:
      - "0.0.0.0:11434:11434"
    volumes:
      - ./ai_data/ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    networks:
      - ai
    ports:
      - "9000:8080"
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      # TTS Configuration - Mimic TTS Voice Selection
      # Available voices: jester, louise, molly
      # Change AUDIO_TTS_VOICE to select which character voice to use by default
      - 'AUDIO_TTS_ENGINE=openai'
      - 'AUDIO_TTS_OPENAI_API_BASE_URL=http://mimic-tts:8000/v1'
      - 'AUDIO_TTS_OPENAI_API_KEY=mimic'
      - 'AUDIO_TTS_MODEL=mimic-tts'
      - 'AUDIO_TTS_VOICE=jester'  # Options: jester, louise, molly
      - 'ENABLE_CORS=True'
      - 'ENABLE_RAG_LOCAL_FILES_IMPORT=True'
      - 'RAG_EMBEDDING_ENGINE=ollama'
      - 'RAG_EMBEDDING_MODEL=nomic-embed-text:latest'
      - 'RAG_FILE_DIR=/foundry_lore'
      - 'DOCS_DIR=/foundry_lore'
    volumes:
      - ./ai_data/open_webui_data:/app/backend/data
      - ./ai_data/foundry:/foundry_lore:ro
    depends_on:
      - ollama


networks:
  ai:
    name: foundry-ai
    internal: false
