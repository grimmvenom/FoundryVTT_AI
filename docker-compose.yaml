# To Run: 
# docker-compose up -d
# # 1. Connect to the internet network
# docker network connect bridge ollama
# 2. Pull your model
# docker exec -it ollama ollama pull llama3.1:8b
# 3. Disconnect and return to air-gap
# docker network disconnect bridge ollama
# or toggle "internal: true" to "internal:false"


services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks:
      - ai_internal  # Locked down
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=http://192.168.7.*,http://localhost:*,http://127.0.0.1:*,app://*,rtvtt://*
    ports:
      - "0.0.0.0:11434:11434" # Explicitly binds to all network interfaces
    volumes:
      - ./ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    container_name: kokoro-tts
    restart: unless-stopped
    networks:
      - ai_internal
    ports:
      - "8880:8880"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    networks:
      - ai_internal
      - default
    ports:
      - "9000:8080"
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      # --- AUDIO CONFIGURATION ---
      - 'AUDIO_TTS_ENGINE=openai'
      - 'AUDIO_TTS_OPENAI_API_BASE_URL=http://kokoro-tts:8880/v1'
      - 'AUDIO_TTS_OPENAI_API_KEY=kokoro' # Required placeholder
      - 'AUDIO_TTS_MODEL=kokoro'
      - 'AUDIO_TTS_VOICE=af_bella' # Default voice
      # ------------------------------------
      - 'ENABLE_CORS=True'
      - 'CORS_ALLOW_ORIGIN="*"'
      - 'ENABLE_RAG_LOCAL_FILES_IMPORT=True'
      - 'RAG_EMBEDDING_ENGINE=ollama'
      - 'RAG_EMBEDDING_MODEL=nomic-embed-text:latest'
      - 'RAG_FILE_DIR=/foundry_lore' # Simplified path
      - 'DOCS_DIR=/foundry_lore'     # Key for directory sync
    volumes:
      # Change /app/data to /app/backend/data
      - ./open_webui_data:/app/backend/data
      - ./training_data/foundry:/foundry_lore:ro
    depends_on:
      - ollama
      - kokoro-tts

  
networks:
  ai_internal:
    internal: false  # <--- This is the magic switch
