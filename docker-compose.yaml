services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks:
      - ai_internal
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=http://192.168.7.*,http://localhost:*,http://127.0.0.1:*,app://*,rtvtt://*
    ports:
      - "0.0.0.0:11434:11434"
    volumes:
      - ./ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  mimic-tts:
    build:
      context: ./mimic_tts
      dockerfile: Dockerfile
    container_name: mimic-tts
    ipc: host
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - ai_internal
    ports:
      - "8188:8000"
    volumes:
      - ./mimic_tts/app:/app/app
      - ./mimic_tts/config:/app/config
      - ./training_data/tts_data/cache:/root/.cache/huggingface
      - ./training_data/tts_data/models:/app/models
      - ./training_data/tts_data/characters:/app/tts_data/characters
      - ./training_data/tts_data/input:/app/tts_data/input
      - ./training_data/tts_data/output:/app/tts_data/output
    environment:
      MIMIC_CONFIG: /app/config/default.ini
      HF_HOME: /root/.cache/huggingface
      HF_HUB_ENABLE_HF_TRANSFER: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: 120
      HF_HUB_ETAG_TIMEOUT: 120
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    networks:
      - ai_internal
      - default
    ports:
      - "9000:8080"
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      # TTS Configuration - Mimic TTS Voice Selection
      # Available voices: jester, louise, molly
      # Change AUDIO_TTS_VOICE to select which character voice to use by default
      - 'AUDIO_TTS_ENGINE=openai'
      - 'AUDIO_TTS_OPENAI_API_BASE_URL=http://mimic-tts:8000/v1'
      - 'AUDIO_TTS_OPENAI_API_KEY=mimic'
      - 'AUDIO_TTS_MODEL=mimic-tts'
      - 'AUDIO_TTS_VOICE=jester'  # Options: jester, louise, molly
      - 'ENABLE_CORS=True'
      - 'ENABLE_RAG_LOCAL_FILES_IMPORT=True'
      - 'RAG_EMBEDDING_ENGINE=ollama'
      - 'RAG_EMBEDDING_MODEL=nomic-embed-text:latest'
      - 'RAG_FILE_DIR=/foundry_lore'
      - 'DOCS_DIR=/foundry_lore'
    volumes:
      - ./open_webui_data:/app/backend/data
      - ./training_data/foundry:/foundry_lore:ro
    depends_on:
      - ollama
      - mimic-tts

networks:
  ai_internal:
    internal: false
