# docker compose run -e MIMIC_CONFIG=/app/config/mac.ini mimic-tts

[runtime]
device = mps
compute_type = float32

[model]
name = Qwen/Qwen3-TTS-1.7B
path = /app/models/qwen-tts/Qwen3-TTS-12Hz-1.7B-Base
torch_dtype = float32

[whisper]
model = large-v3

[voice_clone]
enabled = true
profile_directory = /app/voices

[generation]
temperature = 0.7
top_p = 0.9
max_tokens = 2048

[audio]
sample_rate = 24000
output_format = wav

[paths]
input = /app/input
output = /app/output
voices = /app/voices
models = /app/models
cache = /root/.cache/huggingface