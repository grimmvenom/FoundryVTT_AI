[server]

host = 0.0.0.0
port = 8000


############################################################
# Qwen Models
############################################################

[models]

# Default engine mode:
# clone
# custom
# design

default = clone


# Voice cloning model
clone_name = Qwen3-TTS-12Hz-1.7B-Base
clone_path = /app/models/qwen-tts/Qwen3-TTS-12Hz-1.7B-Base


# Built-in speaker model
custom_name = Qwen3-TTS-12Hz-1.7B-CustomVoice
custom_path = /app/models/qwen-tts/Qwen3-TTS-12Hz-1.7B-CustomVoice


# Voice design model
design_name = Qwen3-TTS-12Hz-1.7B-VoiceDesign
design_path = /app/models/qwen-tts/Qwen3-TTS-12Hz-1.7B-VoiceDesign



############################################################
# Runtime
############################################################

[runtime]

device = cuda

# bfloat16 recommended for modern NVIDIA GPUs
dtype = bfloat16

attention = sdpa



############################################################
# Application Paths
############################################################

[paths]

# Character library
characters = /app/tts_data/characters

# Incoming audio files
input = /app/tts_data/input

# Generated audio
output = /app/tts_data/output



############################################################
# Generation Defaults
############################################################

[generation]

temperature = 0.7

top_p = 0.9

top_k = 50

max_tokens = 2048

do_sample = true

repetition_penalty = 1.05



############################################################
# Audio
############################################################

[audio]

sample_rate = 24000

output_format = wav


############################################################
# Speech To Text / Whisper
############################################################

[transcription]
model = large-v3
device = cuda
compute_type = float16
language = en