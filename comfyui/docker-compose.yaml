services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ai
    volumes:
      - ../ai_data/comfyui:/data
    ports:
      - "8188:8188"


networks:
  ai:
    name: foundry-ai