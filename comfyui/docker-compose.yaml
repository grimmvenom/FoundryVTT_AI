services:
  comfyui:
    image: comfyui:latest
    build:
      context: .
      dockerfile: Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ai
    volumes:
      - ../ai_data/comfyui:/data
      - ./custom_nodes/mimic_tts:/opt/ComfyUI/custom_nodes/mimic_tts
    ports:
      - "8189:8188"
    environment:
      MIMIC_TTS_URL: http://mimic-tts:8000


networks:
  ai:
    name: foundry-ai